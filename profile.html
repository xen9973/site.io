<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Профиль пользователя</title>
  <!-- Подключаем Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Подключаем AOS (анимации при скролле) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
</head>
<body class="bg-gray-900 text-gray-200">

  <!-- Верхняя панель навигации -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex items-center justify-between">
    <div class="text-xl font-bold">Мой Сайт</div>
    <nav class="space-x-6">
      <a href="templates.html" class="text-gray-200 hover:text-white">Главная</a>
      <a href="DownloadPage.html" class="text-gray-200 hover:text-white">Скачать программу</a>
      <a href="#" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded text-white">Log Out</a>
    </nav>
  </header>

  <!-- Основной контент -->
  <main class="max-w-2xl mx-auto p-6">
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg" data-aos="fade-up">
      <!-- Аватар и информация о пользователе -->
      <div class="text-center" data-aos="fade-down">
        <img src="images/avatar.jpg" alt="Аватар пользователя" class="w-24 h-24 rounded-full mx-auto mb-4">
        <h2 class="text-2xl font-bold">Иван Иванов</h2>
        <p class="text-gray-400">@ivanov</p>
      </div>

      <!-- Детали профиля -->
      <div class="mt-6" data-aos="fade-left">
        <p><strong>Email:</strong> ivan@example.com</p>
        <p class="mt-2"><strong>О себе:</strong> Разработчик веб-приложений, увлекаюсь дизайном интерфейсов и UX.</p>
      </div>

      <!-- Кнопка редактирования -->
      <div class="mt-6 text-center" data-aos="zoom-in">
        <a href="#" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded inline-block">
          Редактировать профиль
        </a>
      </div>
    </div>
  </main>

  <!-- Подключаем AOS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true,
    });
  </script>
</body>
</html>
